<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebSocket - Transformador de texto</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; background: #f2f3f1; color: #303a36; font: 16px/1.5 Arial, sans-serif; }
        main { max-width: 760px; margin: 48px auto; padding: 30px; background: white; border: 1px solid #d9dfda; border-top: 4px solid #47745b; border-radius: 6px; }
        h1 { margin: 0 0 8px; font-size: 26px; }
        .descricao { margin: 0; color: #626c66; }
        #status { margin: 20px 0; font-size: 13px; color: #59635d; }
        label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: bold; }
        .entrada { display: flex; gap: 10px; }
        input { min-width: 0; flex: 1; padding: 11px 12px; border: 1px solid #bfc9c1; border-radius: 4px; font: inherit; }
        button { padding: 11px 22px; border: 1px solid #3c644d; border-radius: 4px; background: #47745b; color: white; font: inherit; cursor: pointer; }
        button:hover:not(:disabled) { background: #365d46; }
        button:disabled { opacity: .55; cursor: default; }
        input:focus-visible, button:focus-visible { outline: 2px solid #47745b; outline-offset: 3px; }
        h2 { margin: 30px 0 12px; font-size: 17px; }
        #historico { min-height: 180px; max-height: 380px; overflow-y: auto; padding: 14px; border: 1px solid #dce2dd; border-radius: 4px; background: #f8faf8; overflow-wrap: anywhere; }
        #historico:empty::before { content: "Suas mensagens e as respostas aparecem aqui."; color: #68736b; font-size: 14px; }
        #historico p { margin: 0; padding: 10px 0; border-bottom: 1px solid #e0e6e1; white-space: pre-wrap; }
        #historico p:nth-child(even) { color: #365d46; }
        #historico p:last-child { border-bottom: 0; }
        @media (max-width: 600px) { main { margin: 16px; padding: 20px; } h1 { font-size: 23px; } .entrada { flex-direction: column; } }
    </style>
</head>
<body>
    <main>
    <h1>Transformador de texto</h1>
    <p id="status" role="status">Conectando...</p>

    <div class="entrada">
    <input id="mensagem" placeholder="Digite uma frase" autocomplete="off">
    <button id="enviar" onclick="enviar()" disabled>Enviar</button>
    </div>

    <h2>Histórico de mensagens</h2>
    <div id="historico" role="log" aria-label="Histórico de mensagens"></div>
    </main>

    <script>
        // Estabelece a conexão com o servidor
        const socket = new WebSocket(
            (location.protocol === "https:" ? "wss://" : "ws://") + window.location.host + "/websocket"
        );

        // Libera o envio apenas enquanto a conexao estiver aberta.
        socket.onopen = function() {
            document.getElementById("status").textContent = "Conectado ao servidor";
            document.getElementById("enviar").disabled = false;
        };
        socket.onclose = function() {
            document.getElementById("status").textContent = "Desconectado. Recarregue a página para reconectar.";
            document.getElementById("enviar").disabled = true;
        };
        socket.onerror = function() {
            document.getElementById("status").textContent = "Erro de conexão com o servidor.";
        };
        document.getElementById("mensagem").addEventListener("keydown", function(evento) {
            if (evento.key === "Enter") enviar();
        });

        // Adiciona uma mensagem ao histórico
        function exibir(texto) {
            const p = document.createElement("p");
            p.textContent = texto;
            document.getElementById("historico").appendChild(p);
        }

        // Recebe a resposta do servidor
        socket.onmessage = function(evento) {
            exibir(evento.data);
        };

        // Envia a mensagem ao servidor
        function enviar() {
            const campo = document.getElementById("mensagem");

            if (campo.value.trim() !== "" &&
                socket.readyState === WebSocket.OPEN) {

                exibir("Você: " + campo.value);
                socket.send(campo.value);
                campo.value = "";
            }
        }
    </script>

</body>
</html>
